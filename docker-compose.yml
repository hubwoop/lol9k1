services:
  web:
    build: ./
    volumes:
      - lol9k1-data:/data
    environment:
      - VIRTUAL_HOST=a.domain.org
      - VIRTUAL_PORT=9001
      - LETSENCRYPT_HOST=a.domain.org
      - LETSENCRYPT_EMAIL=user@a.domain.org
      - LETSENCRYPT_TEST=false
      - LOL9K1_SECRET_KEY=change_me_to_a_long_random_string
    container_name: lol9k1
    restart: unless-stopped
    networks:
      - proxy
volumes:
  lol9k1-data:
networks:
  proxy:
    name: nginx_proxy
    external: true
