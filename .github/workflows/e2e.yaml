name: e2e

on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'release*'
    paths-ignore:
      - 'readme.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'readme.md'
      - 'docs/**'

concurrency:
  # Superseded pull request runs are cancelled. Pushes to a branch get a unique
  # group (the run id), so every merged commit gets its own e2e result.
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # matches the python base image in the Dockerfile
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            constraints-test.txt
            requirements-test.txt
            lol9k1/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-test.txt -c constraints-test.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output test-results
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
