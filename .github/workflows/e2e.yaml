name: e2e

on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'release*'
    paths-ignore:
      - 'readme.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'readme.md'
      - 'docs/**'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # matches the python base image in the Dockerfile
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            lol9k1/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: python -m pytest --tracing retain-on-failure --screenshot only-on-failure --output test-results
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
